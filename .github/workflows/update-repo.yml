name: Update RPM Repository Index

on:
  push:
    branches:
      - rpm-repo
    paths:
      - '*.rpm'

jobs:
  update-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: rpm-repo

      - name: Install createrepo_c
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c

      - name: Generate Repository Metadata
        run: |
          createrepo_c .

      - name: Commit and Push Metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add repodata/
          
          # Only commit if the metadata actually changed to prevent infinite loops
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated repodata rebuild [skip ci]"
            git push origin rpm-repo
          else
            echo "No changes detected in repository metadata."
          fi
